name: Schedule Daily Sell Stock Alert

on:
  schedule:
    # ╔═══════════════════════════════════════════════════════════════╗
    # ║  CHANGE THE LINE BELOW to set when your script runs          ║
    # ║                                                                ║
    # ║  Format:  'MINUTE HOUR * * *'                                  ║
    # ║                                                                ║
    # ║  Examples:                                                     ║
    # ║    '0 9 * * *'   = 9:00 AM UTC daily                          ║
    # ║    '30 14 * * *' = 2:30 PM UTC daily                          ║
    # ║    '0 0 * * *'   = Midnight UTC daily                         ║
    # ║                                                                ║
    # ║  Use https://time.is/UTC to find your local time in UTC       ║
    # ╚═══════════════════════════════════════════════════════════════╝
    - cron: '0 19 * * *'

  # This adds a "Run workflow" button so you can test manually
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          if [ -z "$MY_EMAIL" ]; then
            echo "MY_EMAIL secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "MY_EMAIL is configured"
          fi

          if [ -z "$MY_PASSWORD" ]; then
            echo "MY_PASSWORD secret is not set!"
            echo "Go to Settings > Secrets > Actions and add it."
            exit 1
          else
            echo "MY_PASSWORD is configured"
          fi

          echo ""
          echo "All secrets are configured!"

      - name: Check required files exist
        run: |
          echo "Checking for required files..."

          if [ -f "sell_stock_alert_cloud.py" ]; then
            echo "sell_stock_alert_cloud.py found"
          else
            echo "sell_stock_alert_cloud.py not found!"
            exit 1
          fi

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found"
          else
            echo "requirements.txt not found!"
            exit 1
          fi
          
          if [ -f "receiversemail.csv" ]; then
            echo "receiversemail.csv found"
          else
            echo "receiversemail.csv not found!"
            exit 1
          fi

          if [ -f "stockstosell.csv" ]; then
            echo "stockstosell.csv found"
          else
            echo "stockstosell.csvnot found!"
            exit 1
          fi
          
          echo ""
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile sell_stock_alert_cloud.py && echo "Python syntax OK"

      - name: Success
        run: |
          echo ""
          echo "========================================"
          echo "  Your setup passed!"
          echo "========================================"

      - name: Run script
        env:
          # Your secrets are available as environment variables
          # Add more secrets in Settings > Secrets > Actions
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: python sell_stock_alert_cloud.py
